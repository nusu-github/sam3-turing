name: Native C++ portability
on:
  push:
    paths: ['native/**', '.github/workflows/native.yml']
  pull_request:
    paths: ['native/**', '.github/workflows/native.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Download standalone LibTorch 2.10 CPU (Linux)
        if: runner.os == 'Linux'
        run: |
          curl --fail --location --retry 3 'https://download.pytorch.org/libtorch/cpu/libtorch-shared-with-deps-2.10.0%2Bcpu.zip' -o "$RUNNER_TEMP/libtorch.zip"
          unzip -q "$RUNNER_TEMP/libtorch.zip" -d "$RUNNER_TEMP"
      - name: Download standalone LibTorch 2.10 CPU (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest 'https://download.pytorch.org/libtorch/cpu/libtorch-win-shared-with-deps-2.10.0%2Bcpu.zip' -OutFile "$env:RUNNER_TEMP/libtorch.zip"
          Expand-Archive "$env:RUNNER_TEMP/libtorch.zip" -DestinationPath $env:RUNNER_TEMP
      - name: Configure
        run: cmake -S native -B build/native -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="${{ runner.temp }}/libtorch" -DSAM3_WITH_CUDA=OFF -DSAM3_TEST_CUDA=OFF
      - name: Build
        run: cmake --build build/native --config Release --parallel 2
      - name: Test native CPU executables
        run: ctest --test-dir build/native -C Release --output-on-failure
